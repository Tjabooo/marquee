plugins { id 'com.android.application' }

// version.properties holds the app's version; build.sh passes the server address and the signing key.
def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }
def server = (project.findProperty('lilinUrl') ?: '').toString().replace('"', '').replaceAll('/+$', '')
def keystore = System.getenv('LILIN_ANDROID_KEYSTORE')

android {
  namespace 'app.lilin.tv'
  compileSdk 36

  defaultConfig {
    applicationId 'app.lilin.tv'
    minSdk 24
    targetSdk 36
    versionCode appVersion['code'] as int
    versionName appVersion['name']
    // Empty: the app asks for the address on its first start.
    buildConfigField 'String', 'LILIN_URL', "\"${server}\""
  }
  buildFeatures { buildConfig true }

  signingConfigs {
    release {
      if (keystore) {
        storeFile file(keystore)
        storePassword System.getenv('LILIN_ANDROID_KEYSTORE_PASSWORD')
        keyAlias System.getenv('LILIN_ANDROID_KEY_ALIAS') ?: 'lilin'
        keyPassword System.getenv('LILIN_ANDROID_KEYSTORE_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (keystore) signingConfig signingConfigs.release
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  // Lilin's font (public/fonts) is bundled as assets/fonts, so the shell can draw in it before the server answers.
  sourceSets { main { assets.srcDirs += layout.buildDirectory.dir('generated/lilin-assets') } }
  dependenciesInfo { includeInApk false; includeInBundle false }
  lint { checkReleaseBuilds false }
}

dependencies {
  implementation 'androidx.media3:media3-exoplayer:1.8.0'
  implementation 'androidx.media3:media3-exoplayer-hls:1.8.0' // the live 1080p stream for TVs without HEVC
}

def copyFonts = tasks.register('copyLilinFonts', Copy) {
  from(rootProject.file('../../public/fonts')) { include '*.woff2', 'OFL.txt' }
  into layout.buildDirectory.dir('generated/lilin-assets/fonts')
}
tasks.named('preBuild') { dependsOn copyFonts }
