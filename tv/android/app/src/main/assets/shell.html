<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>Marquee</title>
<!--
  Marquee's Android TV shell (tv/android). The app shows this page with the Marquee server as its address,
  then loads the TV screens (public/tv) from the server, the same files the Samsung app runs. Before that,
  it gives them what the Samsung TV has and Android doesn't: an AVPlay-shaped player (the app's native one),
  tizen.application.exit and Samsung's key codes. It also asks for the server's address when the app was
  built without one, and offers the app's own updates.
-->
<style>
  /* The boot screen is tv.css's, so the hand-over to tv.js doesn't move a pixel. The font comes with the app. */
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 200 800;
    src: url("/fonts/bricolage-grotesque-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; color: #F6EADF;
    font-family: system-ui, sans-serif; font-size: 30px; line-height: 1.3;
    background: radial-gradient(ellipse 1500px 700px at 50% -160px, #3D2234 0%, rgba(61, 34, 52, 0) 100%), linear-gradient(#1F1019, #160B12); }
  /* A video is open: the page is see-through, so the picture under it shows (Samsung cuts a hole instead). */
  html.mq-video, html.mq-video body { background: transparent !important; }
  #app { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; }
  .shell { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .shell::before { content: ''; width: 330px; height: 16px; margin-bottom: 30px;
    background: radial-gradient(circle, #F4C152 5px, rgba(244, 193, 82, .35) 6.5px, rgba(244, 193, 82, 0) 9px) 0 50% / 33px 16px repeat-x; }
  .shell b { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 120px; letter-spacing: -0.03em; color: #F4C152;
    text-shadow: 0 0 26px rgba(244, 193, 82, .45); line-height: 1.3; }
  .shell p { margin: 24px 0 0; color: #BA9DAD; max-width: 1100px; }
  .shell p:empty { display: none; }
  .shell p kbd { font: inherit; font-weight: 700; color: #F6EADF; }

  /* Where is Marquee? (first start of an app built without an address) */
  .setup { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 0 40px 240px; }
  .setup .mark { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 46px; letter-spacing: -0.03em; color: #F4C152; text-shadow: 0 0 26px rgba(244, 193, 82, .45); }
  .setup h1 { margin: 40px 0 0; font-family: "Bricolage Grotesque", sans-serif; font-size: 84px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
  .setup .lead { margin: 26px 0 0; max-width: 1180px; color: #BA9DAD; font-size: 34px; }
  .setup .lead b { color: #F6EADF; }
  .setup form { display: flex; align-items: center; margin-top: 56px; }
  .setup input { width: 900px; height: 104px; padding: 0 44px; border-radius: 999px; border: 2px solid rgba(246, 234, 223, .1); outline: none;
    background: rgba(43, 23, 36, .9); color: #F6EADF; font: 700 40px/1 system-ui, sans-serif; caret-color: #F4C152;
    transition: transform .15s ease-out, box-shadow .15s ease-out; }
  .setup input::placeholder { color: rgba(186, 157, 173, .55); }
  .setup button { margin-left: 28px; height: 104px; padding: 0 60px; border-radius: 999px; border: 0; background: rgba(246, 234, 223, .08);
    color: #F6EADF; font: 700 36px/1 system-ui, sans-serif; transition: transform .15s ease-out, background-color .15s ease-out; }
  .setup .focus { transform: scale(1.04); box-shadow: 0 0 0 5px #F4C152, 0 0 44px rgba(244, 193, 82, .42); }
  .setup button.focus { background: #F4C152; color: #1F1019; box-shadow: 0 0 44px rgba(244, 193, 82, .42); }
  .setup .note { margin: 34px 0 0; min-height: 40px; font-size: 32px; color: #FF9B85; }
  .setup .note.busy { color: #BA9DAD; }

  /* The update offer: tv.css's own dialog (.screen.dialog, .dialog-box, .choice) over whatever is showing. */
  .mq-update { z-index: 50; }
  .mq-update p { margin: -12px 0 30px; color: #BA9DAD; font-size: 32px; }
  .mq-update .bar { height: 12px; margin-top: 10px; border-radius: 6px; background: rgba(246, 234, 223, .1); overflow: hidden; }
  .mq-update .bar i { display: block; height: 100%; width: 0; background: #F4C152; transition: width .3s linear; }
</style>
<script>
  window.MARQUEE_SERVER = "__MARQUEE_SERVER__";
  window.MARQUEE_BUILT_IN = "__MARQUEE_BUILT_IN__";
</script>
</head>
<body>
<div id="app"><div class="shell"><b>Marquee</b><p id="shell-note"></p></div></div>
<script>
(function () {
  'use strict';
  var N = window.MarqueeNative;
  if (!N) return;

  // ---------- the remote: Back and media keys come from the app with Samsung's codes ----------
  window.__mqKey = function (code) {
    var e = document.createEvent('Event');
    e.initEvent('keydown', true, true);
    Object.defineProperty(e, 'keyCode', { value: code });
    Object.defineProperty(e, 'which', { value: code });
    (document.activeElement || document.body).dispatchEvent(e);
    return 'ok';
  };

  // ---------- tizen.*: leaving the app; the media keys need no registering here ----------
  window.tizen = {
    application: { getCurrentApplication: function () { return { exit: function () { N.exit(); } }; } },
    tvinputdevice: { registerKey: function () {}, unregisterKey: function () {} },
  };

  // ---------- webapis.avplay, backed by the app's own player ----------
  // Positions arrive twice a second; between them the clock runs on here, so reading the time is free.
  var listener = {}, st, prep = null, seeks = {}, seekId = 0;
  function reset() { st = { ms: 0, at: 0, playing: false, dur: 0, state: 'NONE', tracks: [], audio: -1 }; prep = null; seeks = {}; }
  reset();
  function call(name, arg) {
    var f = listener[name];
    if (typeof f === 'function') { try { f(arg); } catch (err) { setTimeout(function () { throw err; }); } }
  }
  window.__mq = {
    handlers: {},
    ev: function (e) {
      var p;
      switch (e.t) {
        case 'prepared': st.dur = e.dur; st.state = 'READY'; p = prep; prep = null; if (p && p.ok) p.ok(); break;
        case 'time': case 'playing':
          st.ms = e.ms; st.at = Date.now(); st.playing = e.v;
          if (e.t === 'time') call('oncurrentplaytime', e.ms);
          break;
        case 'buffering': call(e.v ? 'onbufferingstart' : 'onbufferingcomplete'); break;
        case 'seeked': p = seeks[e.id]; delete seeks[e.id]; if (p && p.ok) p.ok(); break;
        case 'ended': st.playing = false; st.ms = st.dur; call('onstreamcompleted'); break;
        case 'error':
          st.playing = false;
          p = prep; prep = null;
          if (p && p.fail) p.fail(e.msg); else call('onerror', e.msg);
          break;
        case 'tracks': st.tracks = e.audio || []; st.audio = e.cur; break;
        default: if (__mq.handlers[e.t]) __mq.handlers[e.t](e);
      }
    },
  };
  var avplay = {
    open: function (url) { reset(); listener = {}; st.state = 'IDLE'; document.documentElement.classList.add('mq-video'); N.open(String(url)); },
    close: function () { reset(); document.documentElement.classList.remove('mq-video'); N.close(); },
    stop: function () { st.playing = false; st.state = 'IDLE'; N.stop(); },
    setListener: function (l) { listener = l || {}; },
    setDisplayRect: function () {},      // always the whole screen, letterboxed
    setDisplayMethod: function () {},
    prepare: function () { N.prepare(); },
    prepareAsync: function (ok, fail) { prep = { ok: ok, fail: fail }; N.prepare(); },
    play: function () { st.state = 'PLAYING'; N.play(); },
    pause: function () { st.state = 'PAUSED'; st.ms = avplay.getCurrentTime(); st.at = Date.now(); st.playing = false; N.pause(); },
    seekTo: function (ms, ok, fail) {
      var id = ++seekId;
      seeks[id] = { ok: ok, fail: fail };
      st.ms = ms; st.at = Date.now();
      N.seek(ms, id);
    },
    getCurrentTime: function () {
      var ms = st.ms + (st.playing ? Date.now() - st.at : 0);
      return Math.round(st.dur ? Math.min(ms, st.dur) : ms);
    },
    getDuration: function () { return st.dur; },
    getState: function () { return st.state; },
    getTotalTrackInfo: function () {
      return st.tracks.map(function (t) {
        return { index: t.index, type: 'AUDIO', extra_info: JSON.stringify({ language: t.language || t.label || '', channels: t.channels || '', fourCC: t.codec || '' }) };
      });
    },
    getCurrentStreamInfo: function () { return st.audio >= 0 ? [{ index: st.audio, type: 'AUDIO' }] : []; },
    setSelectTrack: function (type, index) { if (type === 'AUDIO') { st.audio = index; N.selectAudio(index); } },
    setSilentSubtitle: function () {},
  };
  window.webapis = { avplay: avplay };
  // Which video to ask Marquee for: the Samsung app's own (HEVC) when this TV decodes it, else H.264 (Codecs.java).
  window.MARQUEE_TV_PLAY = N.playVariant();

  // ---------- loading the TV screens from the server (like tv/tizen/shell.js, but fetched side by side) ----------
  var server = String(window.MARQUEE_SERVER || '').replace(/\/+$/, '');
  var added = [], waiting = false, retryTimer = null;
  function note(html) { var n = document.getElementById('shell-note'); if (n) n.innerHTML = html; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function add(el) { added.push(el); document.head.appendChild(el); }
  function retry() {
    if (waiting) return;
    added.forEach(function (el) { if (el.parentNode) el.parentNode.removeChild(el); });
    added = [];
    waiting = true;
    note('Kan inte nå Marquee på ' + esc(server) + '. Är servern på? Försöker igen…<br>Tryck <kbd>OK</kbd> för att byta adress.');
    retryTimer = setTimeout(function () { waiting = false; load(); }, 5000);
  }
  function load() {
    var v = Date.now();
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = server + '/tv/tv.css?v=' + v;
    add(css);
    ['sv.js', 'logic.js', 'tv.js'].forEach(function (name, i, all) {
      var s = document.createElement('script');
      s.async = false; // downloaded together, run in this order
      s.src = server + '/tv/' + name + '?v=' + v;
      s.onerror = retry;
      if (i === all.length - 1) s.onload = function () { setTimeout(checkForUpdate, 4000); };
      add(s);
    });
  }
  // While the server can't be reached: OK changes the address, Back leaves.
  document.addEventListener('keydown', function (e) {
    if (!waiting) return;
    if (e.keyCode === 10009 || e.keyCode === 8) N.exit();
    else if (e.keyCode === 13) { clearTimeout(retryTimer); waiting = false; setup(server); }
  });

  // ---------- where is Marquee? ----------
  function setup(current) {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="setup"><div class="mark">Marquee</div>' +
      '<h1>Var finns Marquee?</h1>' +
      '<p class="lead">Skriv adressen till din Marquee-server, till exempel <b>192.168.1.10:8080</b>. ' +
      'Du hittar den i Marquee på telefonen under <b>Inställningar → Android TV</b>.</p>' +
      '<form novalidate><input type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" placeholder="192.168.1.10:8080">' +
      '<button type="submit">Anslut</button></form><p class="note" role="status"></p></div>';
    var input = app.querySelector('input'), button = app.querySelector('button'), msg = app.querySelector('.note'), form = app.querySelector('form');
    input.value = current ? current.replace(/^http:\/\//, '') : '';
    var on = 0, busy = false;
    function paint() {
      input.classList.toggle('focus', on === 0);
      button.classList.toggle('focus', on === 1);
      (on === 0 ? input : button).focus();
    }
    function submit() {
      if (busy) return;
      if (!input.value.trim()) { msg.className = 'note'; msg.textContent = 'Skriv in adressen först.'; on = 0; paint(); return; }
      busy = true;
      msg.className = 'note busy'; msg.textContent = 'Letar efter Marquee…';
      input.blur();
      N.setServer(input.value);
    }
    __mq.handlers.server = function (e) {
      busy = false;
      if (e.ok) return; // the app reloads this page with the new address
      msg.className = 'note';
      msg.textContent = e.problem === 'address' ? 'Det där ser inte ut som en adress. Skriv till exempel 192.168.1.10:8080.'
        : e.problem === 'not-marquee' ? 'Något svarade där, men det var inte Marquee. Kolla adressen och porten.'
        : 'Hittade inget på den adressen. Är TV:n på samma nätverk som Marquee, och är servern på?';
      on = 0; paint();
    };
    form.addEventListener('submit', function (e) { e.preventDefault(); submit(); });
    document.addEventListener('keydown', function (e) {
      if (!document.body.contains(form)) return;
      var k = e.keyCode;
      if (k === 40) { on = 1; paint(); e.preventDefault(); }
      else if (k === 38 || (k === 37 && on === 1)) { on = 0; paint(); e.preventDefault(); }
      else if (k === 13 && on === 1) { submit(); e.preventDefault(); }
      else if (k === 10009) { e.preventDefault(); if (server) location.reload(); else N.exit(); }
    });
    paint();
  }

  // ---------- updates of the app itself ----------
  // The server tells which app version it has (/android.json); a newer one is offered once per start,
  // never in the middle of a video.
  function checkForUpdate() {
    fetch(server + '/android.json', { credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (info) {
        if (!info || !(info.versionCode > N.versionCode())) return;
        (function offer() {
          if (document.documentElement.classList.contains('mq-video')) { setTimeout(offer, 30000); return; }
          offerUpdate(info);
        })();
      })
      .catch(function () { /* no update info: nothing to offer */ });
  }
  function offerUpdate(info) {
    var T = window.MarqueeTvLogic && window.MarqueeTvLogic.T ? window.MarqueeTvLogic.T : function (s) { return s; };
    var el = document.createElement('div');
    el.className = 'screen dialog mq-update';
    el.innerHTML = '<div class="dialog-box"><h2></h2><p></p><div class="acts"></div></div>';
    var title = el.querySelector('h2'), text = el.querySelector('p'), acts = el.querySelector('.acts');
    var buttons = [], on = 0, closeOnly = false;
    function choices(list) {
      acts.innerHTML = '';
      buttons = list.map(function (c) {
        var b = document.createElement('button');
        b.className = 'choice';
        b.textContent = c.label;
        b.act = c.act;
        acts.appendChild(b);
        return b;
      });
      on = 0; paint();
    }
    function paint() { buttons.forEach(function (b, i) { b.classList.toggle('focus', i === on); }); }
    function close() { document.removeEventListener('keydown', keys, true); delete __mq.handlers.update; if (el.parentNode) el.parentNode.removeChild(el); }
    function progress(pct) {
      acts.innerHTML = '<div class="bar"><i></i></div>';
      buttons = [];
      acts.querySelector('i').style.width = Math.max(0, pct) + '%';
    }
    function keys(e) {
      var k = e.keyCode;
      e.preventDefault();
      e.stopImmediatePropagation();
      if (k === 38 || k === 37) { on = Math.max(0, on - 1); paint(); }
      else if (k === 40 || k === 39) { on = Math.min(buttons.length - 1, on + 1); paint(); }
      else if (k === 13 && buttons[on]) buttons[on].act();
      else if (k === 10009 || k === 8 || k === 27) { if (buttons.length || closeOnly) close(); }
    }
    function ask() {
      title.textContent = T('A new version of the Marquee app is here');
      text.textContent = T('Version {0}. It takes about a minute.', info.versionName || info.versionCode);
      choices([{ label: T('Update now'), act: start }, { label: T('Later'), act: close }]);
    }
    function start() {
      title.textContent = T('Updating the Marquee app…');
      text.textContent = T('Getting the new version…');
      progress(0);
      N.update(info.apk || '/android.apk');
    }
    __mq.handlers.update = function (e) {
      if (e.s === 'progress') { var i = acts.querySelector('i'); if (i) i.style.width = e.pct + '%'; }
      else if (e.s === 'installing') { text.textContent = T('Confirm with Install on the screen that opens.'); progress(100); closeOnly = true; setTimeout(close, 1500); }
      else if (e.s === 'allow') {
        title.textContent = T('Let Marquee install its update');
        text.textContent = T('Turn on Marquee in the list that opened, then press Back. The update carries on by itself.');
        closeOnly = true;
      } else if (e.s === 'allow-manual') {
        title.textContent = T('Let Marquee install its update');
        text.textContent = T('In the TV’s settings, allow Marquee to install unknown apps (often under Device preferences → Security). Then update again.');
        choices([{ label: T('OK'), act: close }]);
      } else if (e.s === 'denied') {
        title.textContent = T('The update was not installed');
        text.textContent = T('Marquee wasn’t allowed to install apps. You can update next time the app starts.');
        choices([{ label: T('OK'), act: close }]);
      } else if (e.s === 'error') {
        title.textContent = T('The update didn’t download');
        text.textContent = T('Marquee will offer it again next time the app starts.');
        choices([{ label: T('OK'), act: close }]);
      }
    };
    document.addEventListener('keydown', keys, true);
    document.body.appendChild(el);
    ask();
  }

  if (!server) setup('');
  else load();
})();
</script>
</body>
</html>
