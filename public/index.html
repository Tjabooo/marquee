<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F1019">
  <meta name="color-scheme" content="dark">
  <!-- Lets "Add to Home Screen" open it like an app on iPhone/Android -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marquee">
  <!-- use-credentials: the manifest and icons sit behind the same Cloudflare sign-in as the app -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Marquee</title>
  <!-- The colours picked in Settings, applied before anything is drawn (app.js keeps this copy up to date) -->
  <script>
    try {
      const t = JSON.parse(localStorage.getItem('marquee:theme'));
      if (t && t.vars) {
        const root = document.documentElement;
        for (const k in t.vars) root.style.setProperty(k, t.vars[k]);
        root.style.colorScheme = t.scheme;
        root.dataset.scheme = t.scheme;
        document.querySelector('meta[name="theme-color"]').content = t.vars['--velvet'];
      }
    } catch { /* first visit, or storage blocked: default colours */ }
    // The page below is written in English: keep it hidden until i18n.js has put it in Swedish (never for long).
    try {
      const wanted = localStorage.getItem('marquee:lang') || (document.cookie.match(/(?:^|;\s*)marquee_lang=(\w+)/) || [])[1] || (/^sv\b/i.test(navigator.language) ? 'sv' : 'en');
      if (wanted === 'sv') {
        document.documentElement.classList.add('i18n-wait');
        setTimeout(() => document.documentElement.classList.remove('i18n-wait'), 4000);
      }
    } catch { /* storage blocked: English until the app has started */ }
  </script>
  <style>html.i18n-wait body { visibility: hidden; }</style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/notes.css">
</head>
<body>
  <header class="top" id="top">
    <div class="top-inner">
      <h1 class="wordmark"><a href="/" id="home-link" aria-label="Marquee — Discover">Marquee</a></h1>
      <!-- Phones and tablets: what Discover shows (type, genre) behind one button, so nothing sits on the billboard -->
      <button type="button" class="browse-btn" id="browse-btn" aria-haspopup="dialog" hidden><span id="browse-label">Browse</span><i class="chev" aria-hidden="true"></i></button>
      <!-- The sections: a tab bar at the bottom on phones and tablets, links in this header on wide screens -->
      <nav class="tabs" aria-label="Sections">
        <button class="tab" data-view="discover" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M10 9.5v5l4-2.5z"/></svg>
          <span>Discover</span>
        </button>
        <button class="tab" data-view="library">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M10 4v16M15 5l4 14.5"/></svg>
          <span>Library</span>
          <b class="tab-badge" id="dl-badge" hidden></b>
        </button>
        <button class="tab" data-view="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Settings</span>
        </button>
      </nav>
      <div class="top-actions">
        <form class="search" role="search" id="search-form">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <label class="sr-only" for="q">Search</label>
          <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Search films and shows">
          <button type="button" class="search-clear" id="q-clear" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </form>
        <button type="button" class="search-cancel" id="search-cancel">Cancel</button>
        <button type="button" class="icon-btn search-toggle" id="search-toggle" aria-label="Search" aria-controls="search-form" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        </button>
        <button type="button" class="news-btn" id="whats-new-btn" aria-haspopup="dialog" hidden>
          <span class="news-bulb" aria-hidden="true"></span><span class="news-label">What’s new</span><span class="news-count" hidden></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="view-discover" class="view" aria-labelledby="discover-heading">
      <h2 class="view-heading" id="discover-heading">Trending this week</h2>
      <div id="discover-body"></div>
    </section>

    <section id="view-library" class="view" aria-labelledby="library-heading" hidden>
      <div class="view-head library-heading-row">
        <h2 class="view-heading" id="library-heading">Your library</h2>
        <button class="head-btn" id="find-torrents" hidden>Find torrents</button>
        <button class="head-btn" id="manage-downloads" aria-label="Manage server downloads" hidden>Manage downloads</button>
      </div>
      <div id="library-body"></div>
      <p id="library-live" class="sr-only" role="status" aria-live="polite"></p>
    </section>

    <section id="view-settings" class="view" aria-labelledby="settings-heading" hidden>
      <h2 class="view-heading" id="settings-heading">Settings</h2>
      <div id="settings-body"></div>
    </section>
  </main>


  <!-- Title details: bottom sheet on phones, centered panel on wide screens -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="icon-btn sheet-close" id="sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="sheet-body"></div>
  </div>

  <!-- "Play on TV" picker -->
  <div class="sheet-backdrop picker-backdrop" id="picker-backdrop" hidden></div>
  <div class="sheet picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="icon-btn sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="sheet-content" id="picker-body"></div>
  </div>

  <!-- Remote for whatever is playing on a TV -->
  <div class="remote" id="remote" role="dialog" aria-modal="true" aria-labelledby="remote-title" hidden>
    <div id="remote-body"></div>
  </div>

  <!-- Shows while something is playing on a TV -->
  <button class="nowbar" id="nowbar" hidden></button>

  <!-- Player -->
  <div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="player-title" hidden>
    <!-- The video and everything drawn over the picture: subtitles, feedback, spinner -->
    <div class="player-stage" id="player-stage">
      <video id="video" playsinline preload="metadata" x-webkit-airplay="allow"></video>
      <div class="player-subs" id="player-subs" aria-hidden="true">
        <div class="subs-top"></div>
        <div class="subs-bottom"></div>
      </div>
      <div class="player-spinner" id="player-spinner" hidden></div>
      <div class="player-osd" id="player-osd" aria-hidden="true"></div>
      <!-- Watch Together: the countdown to a planned start, floating reactions and chat -->
      <div class="party-countdown" id="party-countdown" role="status" hidden></div>
      <div class="reaction-layer" id="reaction-layer" aria-hidden="true"></div>
      <div class="chat-layer" id="chat-layer" aria-hidden="true"></div>
    </div>
    <div class="player-bar">
      <button class="icon-btn" id="player-close" aria-label="Close player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <p class="player-title" id="player-title"></p>
    </div>
    <p class="player-note" id="player-note" role="status" hidden></p>
    <!-- Big buttons in the middle: play/pause and ±10 s on touch screens, play while paused elsewhere -->
    <div class="player-center">
      <button class="pc-btn pc-skip" data-skip="-10" aria-label="Back 10 seconds (J)"></button>
      <button class="pc-btn pc-big-play" aria-label="Play (Space)"></button>
      <button class="pc-btn pc-skip" data-skip="10" aria-label="Forward 10 seconds (L)"></button>
    </div>
    <div class="player-controls" id="player-controls">
      <div class="seek-row">
        <span class="pc-time" id="pc-time">0:00</span>
        <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <div class="seek-track">
            <div class="seek-downloaded" id="seek-downloaded" hidden></div>
            <div class="seek-buffer" id="seek-buffer"></div>
            <div class="seek-fill" id="seek-fill"></div>
          </div>
          <div class="seek-thumb" id="seek-thumb"></div>
          <div class="seek-tip" id="seek-tip" hidden></div>
        </div>
        <button class="pc-time pc-duration" id="pc-duration" title="Show time remaining">–:––</button>
      </div>
      <div class="pc-row">
        <button class="pc-btn pc-play" id="pc-play" aria-label="Play (Space)"></button>
        <button class="pc-btn pc-skip" data-skip="-10" aria-label="Back 10 seconds (J)"></button>
        <button class="pc-btn pc-skip" data-skip="10" aria-label="Forward 10 seconds (L)"></button>
        <div class="pc-volume" id="pc-volume">
          <button class="pc-btn" id="pc-mute" aria-label="Mute (M)"></button>
          <input type="range" id="pc-vol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        </div>
        <span class="pc-spacer"></span>
        <button class="watch-start" id="watch-btn" type="button" aria-controls="watch-bar" aria-expanded="false"><span class="watch-start-faces" id="watch-btn-faces"></span><span class="watch-start-label" id="watch-btn-label">Watch together</span><span class="watch-start-badge" id="watch-btn-badge" hidden></span></button>
        <button class="pc-btn cc-btn" id="night-btn" aria-label="Bedtime: night mode and sleep timer (N)" aria-haspopup="menu" aria-controls="night-menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A7.5 7.5 0 0 1 9.4 4.5a7.5 7.5 0 1 0 10.1 10.1z"/></svg>
        </button>
        <div class="cc-menu night-menu" id="night-menu" role="menu" aria-label="Bedtime" hidden></div>
        <button class="pc-btn cc-btn quality-btn" id="quality-btn" aria-label="Quality" aria-haspopup="menu" aria-controls="quality-menu" aria-expanded="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><text id="quality-badge" x="12" y="14.6" text-anchor="middle">HD</text></svg>
        </button>
        <div class="cc-menu night-menu quality-menu" id="quality-menu" role="menu" aria-label="Quality" hidden></div>
        <button class="pc-btn cc-btn" id="cc-btn" aria-label="Subtitles (C)" aria-haspopup="menu" aria-expanded="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10.5 10.2a2 2 0 1 0 0 3.6M17 10.2a2 2 0 1 0 0 3.6"/></svg>
        </button>
        <div class="cc-menu" id="cc-menu" role="menu" aria-label="Subtitles" hidden></div>
        <button class="pc-btn cc-btn" id="sync-btn" aria-label="Audio" aria-haspopup="menu" aria-controls="sync-menu" aria-expanded="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
        </button>
        <div class="cc-menu audio-menu" id="sync-menu" role="menu" aria-label="Audio" hidden></div>
        <p class="sr-only" id="audio-status" role="status" aria-live="polite" aria-atomic="true"></p>
        <button class="pc-btn cc-btn airplay-btn" id="airplay-btn" aria-label="AirPlay" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-1"/><path d="M12 14l5 6H7z"/></svg>
        </button>
        <button class="pc-btn" id="pc-pip" aria-label="Picture in picture (P)" hidden></button>
        <button class="pc-btn" id="pc-fs" aria-label="Fullscreen (F)"></button>
      </div>
    </div>
    <!-- Watch Together: the room panel. Docked on the right on wide screens (the picture moves over),
         a sheet over the lower picture on phones. app.js renderParty() fills it in. -->
    <aside class="room" id="watch-bar" role="region" aria-label="Watch Together room" hidden>
      <header class="room-head">
        <div class="room-sign"><span class="room-bulbs" aria-hidden="true"></span><span class="room-kicker">Watch together</span><span class="room-bulbs" aria-hidden="true"></span></div>
        <button class="icon-btn room-close" id="watch-hide" type="button" aria-label="Hide the room (the room stays open)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <p class="room-title" id="watch-title"></p>
        <p class="room-status" id="watch-status" role="status" data-tone="wait"></p>
      </header>
      <div class="room-body">
        <section class="room-section" aria-labelledby="watch-people-label">
          <h3 class="room-label" id="watch-people-label">In the room <span id="watch-count"></span></h3>
          <ul class="room-roster" id="watch-members"></ul>
          <p class="room-hint" id="watch-hint"></p>
        </section>
        <section class="room-section" aria-labelledby="watch-invite-label">
          <h3 class="room-label" id="watch-invite-label">Invite</h3>
          <div class="room-invite-actions">
            <button class="room-pill" id="watch-invite" type="button" aria-expanded="false" aria-controls="watch-invite-list">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 8-2.5 8h17S18 15 18 8.5zM10.3 20a2 2 0 0 0 3.4 0"/></svg>Notify someone</button>
            <button class="room-pill" id="watch-copy" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>Copy link</button>
          </div>
          <div class="room-invitees" id="watch-invite-list" hidden></div>
        </section>
      </div>
      <section class="room-chat" aria-label="Room chat">
        <ol class="chat-log" id="chat-log" aria-label="Messages" aria-live="polite"></ol>
        <p class="chat-empty" id="chat-empty">No messages yet. Say hi: messages also pop up over the picture.</p>
        <div class="reaction-bar" id="reaction-bar" role="group" aria-label="Send a reaction"></div>
        <form class="chat-form" id="chat-form" autocomplete="off">
          <input id="chat-input" type="text" maxlength="300" placeholder="Message the room" aria-label="Message the room" enterkeyhint="send">
          <button class="chat-send" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </form>
      </section>
      <footer class="room-foot">
        <small>Subtitles and volume are just for you.</small>
        <button class="room-leave" id="watch-leave" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14"/><path d="M10 8l-4 4 4 4M6 12h9"/></svg>Leave room</button>
      </footer>
    </aside>
    <button class="skip-intro" id="skip-intro" type="button" aria-keyshortcuts="S" hidden>
      Skip intro
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l8 7-8 7zM14 5l8 7-8 7z"/></svg>
    </button>
    <section class="up-next" id="up-next" aria-labelledby="up-next-label up-next-title" hidden>
      <div class="up-next-copy">
        <div class="up-next-art" id="up-next-art" aria-hidden="true"></div>
        <div>
          <p class="up-next-label" id="up-next-label">Up next</p>
          <h2 id="up-next-title"></h2>
        </div>
      </div>
      <div class="up-next-actions">
        <button class="up-next-play" id="up-next-play" type="button">Next episode</button>
        <button class="up-next-dismiss" id="up-next-dismiss" type="button">Keep watching</button>
      </div>
      <p class="up-next-error" id="up-next-error" hidden></p>
    </section>
    <p class="sr-only" id="up-next-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <section class="part-popup" id="part-popup" role="dialog" aria-labelledby="part-popup-label part-popup-title" aria-describedby="part-popup-body" hidden>
      <div class="part-popup-lights" aria-hidden="true"></div>
      <p class="part-popup-label" id="part-popup-label"></p>
      <h2 id="part-popup-title"></h2>
      <p class="part-popup-body" id="part-popup-body"></p>
      <div class="bulbs part-popup-bar" id="part-popup-bar" aria-hidden="true"><i></i></div>
      <p class="part-popup-progress" id="part-popup-progress"></p>
      <div class="part-popup-actions">
        <button class="part-popup-primary" id="part-popup-primary" type="button"></button>
        <button class="part-popup-secondary" id="part-popup-secondary" type="button"></button>
      </div>
    </section>
    <div class="player-help" id="player-help" role="dialog" aria-label="Keyboard shortcuts" hidden></div>
    <p class="player-error" id="player-error" hidden></p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
