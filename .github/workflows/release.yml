name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tjabooo/marquee
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/tjabooo/marquee
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MarqueeSetup.exe (the Windows setup wizard)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/build-setup-exe.ps1 -Version "$env:GITHUB_REF_NAME" -Out MarqueeSetup.exe
      - name: The wizard builds its window
        shell: pwsh
        run: powershell -NoProfile -STA -ExecutionPolicy Bypass -File scripts/windows/setup-wizard.ps1 -SelfTest
      - uses: actions/upload-artifact@v4
        with:
          name: marquee-setup-exe
          path: MarqueeSetup.exe
          if-no-files-found: error

  release:
    needs: windows-setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: marquee-setup-exe
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Build the source archive and checksums
        run: |
          git archive --format=tar.gz --prefix="marquee-$GITHUB_REF_NAME/" -o "marquee-$GITHUB_REF_NAME.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "marquee-$GITHUB_REF_NAME.tar.gz" MarqueeSetup.exe > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            marquee-${{ github.ref_name }}.tar.gz
            MarqueeSetup.exe
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Marquee $GITHUB_REF_NAME" --notes-file notes.md \
            "marquee-$GITHUB_REF_NAME.tar.gz" MarqueeSetup.exe SHA256SUMS

  verify:
    needs: [image, release]
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ github.ref_name }}
